# OFFLINE FIXTURE ONLY: synthetic source/commit/secret, not deployable.
# Render real reviewed bindings; both project and stage must remain inactive until approved.
name: rompy-staged-smoke
description: INACTIVE staged reference candidate; build/runtime/admission
  prerequisites require review
active: false
resources:
  sources:
  - name: runtime-source
    github:
      username: example
      repository: example/runtime
  builds:
  - name: rompy-runtime
    sourceRef:
      name: runtime-source
      ref: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    dockerfile: runtime/Dockerfile
    resources:
      requests:
        cpu: '1'
        memory: 4Gi
      limits:
        cpu: '1'
        memory: 4Gi
  tasks:
  - name: generate
    image:
      buildRef: rompy-runtime
    command: /opt/rompy/bin/python -m rompy_prax_runtime generate
    timeout: 120
    resources:
      requests:
        cpu: '1'
        memory: 1Gi
      limits:
        cpu: '1'
        memory: 1Gi
    env:
    - name: DATAMESH_TOKEN
      secretRef:
        name: datamesh-tech
        key: token
    inputs:
      parameters:
      - name: handoff-json
        env: ROMPY_HANDOFF_JSON
    outputs:
      artifacts:
      - name: workspace
        path: /work/run
        optional: true
    onDemand: true
    retryStrategy:
      limit: 1
      retryPolicy: OnTransientError
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 10s
  - name: swan
    image:
      ghcr.io/rom-py/swan@sha256:17dd749381bdf4bfd1f5c717b2f4a07b3d740a125ca12d4b64db23963a4d6dc2
    command: bash -c 'set -eu; if [ "${DATAMESH_TOKEN+x}" = x ]; then echo
      '"'"'Unexpected Datamesh credential in model task'"'"'; exit 64; fi; cd
      /work/run; sha256sum -c native-inputs.sha256; cd
      examples/example_declarative/run1; exec /usr/bin/mpirun -np 4
      /usr/local/bin/swan.exe'
    timeout: 120
    resources:
      requests:
        cpu: '4'
        memory: 512Mi
      limits:
        cpu: '4'
        memory: 512Mi
    inputs:
      artifacts:
      - name: workspace
        path: /work/run
    outputs:
      artifacts:
      - name: workspace
        path: /work/run
    onDemand: true
    retryStrategy:
      limit: 1
      retryPolicy: OnTransientError
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 10s
  - name: verify
    image:
      buildRef: rompy-runtime
    command: /opt/rompy/bin/python -m rompy_prax_runtime verify
    timeout: 60
    resources:
      requests:
        cpu: '1'
        memory: 512Mi
      limits:
        cpu: '1'
        memory: 512Mi
    inputs:
      artifacts:
      - name: workspace
        path: /work/run
    outputs:
      artifacts:
      - name: verification
        path: /work/report
    onDemand: true
    retryStrategy:
      limit: 1
      retryPolicy: OnTransientError
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 10s
  pipelines:
  - name: swan-mpi
    timeout: 360
    arguments:
      parameters:
      - name: handoff-json
        value: ''
        overridable: true
    dag:
    - name: generate
      taskRef: generate
      arguments:
        parameters:
        - name: handoff-json
          value: '{{ workflow.parameters.handoff-json }}'
    - name: swan
      taskRef: swan
      dependencies:
      - generate
      arguments:
        artifacts:
        - name: workspace
          path: /work/run
          stepRef:
            name: generate
            artifactRef: workspace
    - name: verify
      taskRef: verify
      dependencies:
      - swan
      arguments:
        artifacts:
        - name: workspace
          path: /work/run
          stepRef:
            name: swan
            artifactRef: workspace
  stages:
  - name: dev
    active: false
    resources:
      pipelines:
      - swan-mpi
