[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rompy-prax-runtime"
version = "0.1.0.dev0"
description = "Inactive staged PRAX reference pipeline for rompy generation and upstream SWAN"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "third-party/*-NOTICE"]
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=8", "ruamel.yaml>=0.18.17,<0.19", "oceanum-prax-cli>=0.3.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
